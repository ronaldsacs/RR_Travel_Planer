<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner - Selectable Dropdown</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #2563eb; --primary-light: #eff6ff; --primary-dark: #1e40af;
            --secondary: #64748b; --bg-body: #f1f5f9; --bg-card: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
            --success: #10b981; --danger: #ef4444; --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* LOGIN */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #0f172a 100%);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .auth-card {
            background: white; padding: 2.5rem; border-radius: 16px;
            width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }
        .auth-input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .auth-input:focus { border-color: var(--primary); }
        .btn-block { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* MAIN APP */
        #app-screen { display: none; flex: 1; height: 100vh; }
        
        aside { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem; z-index: 10; }
        .brand { font-size: 1.25rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2.5rem; }
        nav button { background: none; border: none; width: 100%; padding: 0.75rem 1rem; text-align: left; cursor: pointer; color: var(--text-muted); border-radius: var(--radius); display: flex; align-items: center; gap: 0.75rem; font-weight: 500; transition: 0.2s; margin-bottom: 0.5rem; }
        nav button:hover, nav button.active { background-color: var(--primary-light); color: var(--primary); }
        nav button.active { background-color: var(--primary); color: white; }

        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { background: white; border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .header-actions { display: flex; gap: 0.75rem; }
        
        .btn { padding: 0.55rem 1rem; border-radius: var(--radius); border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-danger { color: var(--danger); border-color: var(--border); }
        .btn-danger:hover { background: #fef2f2; border-color: var(--danger); }

        .content-scroll { flex: 1; overflow-y: auto; padding: 2rem; }

        /* Dashboard */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; }
        .stat-title { color: var(--text-muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        .stat-value { font-size: 1.75rem; font-weight: 700; margin-top: 0.5rem; }

        /* Table */
        .table-container { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
        .table-controls { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 1rem; background: #f8fafc; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover { background-color: #f8fafc; }

        .status-badge { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-planned { background: #eff6ff; color: var(--primary); }
        .badge-completed { background: #ecfdf5; color: var(--success); }

        /* Modal & Select */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 50; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-overlay.open { display: flex; }
        .modal { background: white; width: 95%; max-width: 900px; max-height: 90vh; border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
        .modal-body { padding: 1.5rem; overflow-y: auto; }
        .modal-footer { padding: 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 1rem; background: #f8fafc; }
        
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--secondary); }
        .form-group input, .form-group select, .form-group textarea { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; outline: none; font-size: 0.9rem; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }

        #visitForm { display: block; } #customerForm { display: none; }
        .full-width { grid-column: span 2; }

        /* Standard Select Styling */
        select.custom-select { 
            width: 100%; 
            padding: 0.6rem; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            background-color: white; 
            appearance: none; /* remove default arrow */ 
            cursor: pointer; 
            font-size: 0.9rem; 
        }
        select.custom-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="auth-screen">
        <div class="auth-card">
            <div style="font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem; text-align: center;">Travel Planner</div>
            <div style="text-align: center; color: var(--secondary); margin-bottom: 2rem; font-size: 0.9rem;">Sign in to manage your schedule</div>
            <input type="email" id="login-email" class="auth-input" placeholder="Email Address">
            <input type="password" id="login-password" class="auth-input" placeholder="Password">
            <button class="btn-block" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen">
        <!-- Sidebar -->
        <aside>
            <div class="brand"><i class="ph ph-airplane-tilt"></i> Travel Planner</div>
            <nav>
                <button class="active" onclick="switchTab('visits')"><i class="ph ph-calendar-check"></i> Visit Planner</button>
                <button onclick="switchTab('customers')"><i class="ph ph-users-three"></i> Customer Master</button>
                <button onclick="switchTab('dashboard')"><i class="ph ph-chart-pie-slice"></i> Analytics / KPI</button>
            </nav>
        </aside>

        <main>
            <header>
                <div style="font-size: 1.2rem; font-weight: 700;" id="page-title">Visit Planner</div>
                <div class="header-actions">
                    <span style="font-size: 0.85rem; font-weight: 600; color: var(--secondary); margin-right: 1rem;" id="user-display"></span>
                    <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleImport(this)">
                    <button class="btn" onclick="document.getElementById('fileInput').click()"><i class="ph ph-upload-simple"></i> Import</button>
                    <button class="btn" onclick="exportData()"><i class="ph ph-download-simple"></i> Export</button>
                    <button class="btn btn-primary" onclick="openModal()"><i class="ph ph-plus"></i> Add New</button>
                    <button class="btn btn-danger" onclick="logout()"><i class="ph ph-sign-out"></i></button>
                </div>
            </header>

            <div class="content-scroll">
                <!-- DASHBOARD VIEW -->
                <div id="view-dashboard" style="display: none;">
                    <div class="stats-grid">
                        <div class="stat-card"><span class="stat-title">Total Visits</span><span class="stat-value" id="stat-total">0</span></div>
                        <div class="stat-card"><span class="stat-title">Total Opportunities (€)</span><span class="stat-value" id="stat-opp">€0</span></div>
                        <div class="stat-card"><span class="stat-title">Total Orders (€)</span><span class="stat-value" id="stat-order">€0</span></div>
                    </div>
                </div>

                <!-- DATA TABLE VIEW -->
                <div id="view-data">
                    <div class="table-container">
                        <div class="table-controls">
                            <input type="text" placeholder="Search..." style="padding:0.5rem; border:1px solid var(--border); border-radius:6px; width:300px; outline:none;" onkeyup="filterTable(this.value)">
                        </div>
                        <div style="overflow-x: auto;">
                            <table id="dataTable"><thead></thead><tbody></tbody></table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="entryModal">
        <div class="modal">
            <div style="padding:1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">
                <h3 id="modalTitle">Add Entry</h3>
                <i class="ph ph-x" onclick="closeModal()" style="cursor:pointer; font-size:1.5rem;"></i>
            </div>
            <div class="modal-body">
                
                <!-- VISIT FORM (With SELECTABLE DROPDOWN) -->
                <form id="visitForm">
                    <input type="hidden" id="v_editId">
                    <div class="form-grid">
                        
                        <!-- THE FIX: Select Customer Dropdown -->
                        <div class="form-group">
                            <label>Select Customer</label>
                            <select id="customer_select" class="custom-select" onchange="onCustomerSelectChange(this)">
                                <option value="" disabled selected>-- Select Customer --</option>
                                <!-- Options populated by JS -->
                            </select>
                        </div>

                        <!-- Auto-filled Fields -->
                        <div class="form-group"><label>Customer Code</label><input type="text" id="v_code" readonly style="background: #f1f5f9; cursor: not-allowed;"></div>
                        <div class="form-group"><label>COMPANY</label><input type="text" id="v_company"></div>
                        <div class="form-group"><label>COUNTRY</label><input type="text" id="v_country"></div>
                        <div class="form-group"><label>ADDRESS</label><input type="text" id="v_address"></div>
                        <div class="form-group"><label>PLACE</label><input type="text" id="v_place"></div>
                        <div class="form-group"><label>Visit Plan</label><input type="text" id="v_plan"></div>
                        <div class="form-group"><label>Visit Date</label><input type="date" id="v_date"></div>
                        <div class="form-group"><label>Status</label><select id="v_status"><option>Planned</option><option>Completed</option><option>Pending</option></select></div>
                        <div class="form-group"><label>Opp. Value (€)</label><input type="number" id="v_val"></div>
                        <div class="form-group full-width" style="grid-column: span 2"><label>Remarks</label><textarea id="v_remarks" rows="2" style="width:100%; padding:0.6rem; border-radius:6px; border:1px solid var(--border);"></textarea></div>
                    </div>
                </form>

                <!-- CUSTOMER FORM -->
                <form id="customerForm">
                    <input type="hidden" id="c_editId">
                    <div class="form-grid">
                        <div class="form-group"><label>Customer Code</label><input type="text" id="c_code" required></div>
                        <div class="form-group"><label>COMPANY</label><input type="text" id="c_company" required></div>
                        <div class="form-group"><label>COUNTRY</label><input type="text" id="c_country"></div>
                        <div class="form-group"><label>ADDRESS</label><input type="text" id="c_address"></div>
                        <div class="form-group"><label>80-20</label><select id="c_8020"><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></div>
                        <div class="form-group"><label>Service - Responsible</label><input type="text" id="c_resp"></div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveData()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const API_URL = window.location.origin + '/api';
        let currentTab = 'visits';
        let visits = [], customers = [];
        let currentUser = JSON.parse(localStorage.getItem('user'));

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                showApp();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        });

        // --- AUTH ---
        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            const res = await fetch(`${API_URL}/login`, {
                method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email, password})
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('user', JSON.stringify(currentUser));
                showApp();
            } else {
                alert(data.error);
            }
        }

        function logout() {
            localStorage.removeItem('user');
            location.reload();
        }

        function showApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            document.getElementById('user-display').innerText = currentUser.email;
            loadData();
        }

        // --- DATA LOAD ---
        async function loadData() {
            // 1. Always Load Customers (Required for Dropdown)
            const cRes = await fetch(`${API_URL}/customers?userId=${currentUser.id}`);
            customers = await cRes.json();
            
            // 2. Load Visits if needed
            if (currentTab === 'visits') {
                const vRes = await fetch(`${API_URL}/visits?userId=${currentUser.id}`);
                visits = await vRes.json();
            }
            
            // 3. Update Dashboard if needed
            if (currentTab === 'dashboard') {
                const kpiRes = await fetch(`${API_URL}/kpi?userId=${currentUser.id}`);
                const kpi = await kpiRes.json();
                document.getElementById('stat-total').innerText = kpi.totalVisits;
                document.getElementById('stat-opp').innerText = '€' + kpi.totalOpp.toLocaleString();
                document.getElementById('stat-order').innerText = '€' + kpi.totalOrder.toLocaleString();
            }

            renderView();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            if(tab==='visits') document.querySelectorAll('nav button')[0].classList.add('active');
            if(tab==='customers') document.querySelectorAll('nav button')[1].classList.add('active');
            if(tab==='dashboard') document.querySelectorAll('nav button')[2].classList.add('active');

            document.getElementById('view-dashboard').style.display = tab === 'dashboard' ? 'block' : 'none';
            document.getElementById('view-data').style.display = tab === 'dashboard' ? 'none' : 'block';
            document.getElementById('page-title').innerText = tab === 'visits' ? 'Visit Planner' : tab === 'customers' ? 'Customer Master' : 'Analytics / KPI';
            
            loadData();
        }

        // --- DROPDOWN LOGIC (THE FIX) ---
        function renderCustomerDropdown() {
            const select = document.getElementById('customer_select');
            select.innerHTML = '<option value="" disabled selected>-- Select Customer --</option>';
            
            if(customers.length === 0) {
                const opt = document.createElement('option');
                opt.innerText = "No customers in database";
                select.appendChild(opt);
                return;
            }

            customers.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c._id; // Value is the ID for logic
                // Display: "Code - Company Name"
                opt.text = `${c["Customer Code"]} - ${c["COMPANY"]}`;
                select.appendChild(opt);
            });
        }

// Find this function and replace it with the updated version
function onCustomerSelectChange(selectEl) {
    const customerId = selectEl.value;
    if (!customerId) return;

    const customer = customers.find(c => c._id == customerId);

    if (customer) {
        document.getElementById('v_code').value = customer["Customer Code"] || "";
        document.getElementById('v_company').value = customer["COMPANY"] || "";
        document.getElementById('v_country').value = customer["COUNTRY"] || "";
        document.getElementById('v_address').value = customer["ADDRESS"] || "";
        document.getElementById('v_place').value = "";
    }
}

        // --- RENDER ---
        function renderView() {
            const tableHead = document.querySelector('#dataTable thead');
            const tableBody = document.querySelector('#dataTable tbody');
            const data = currentTab === 'visits' ? visits : customers;
            const schema = currentTab === 'visits' ? ["Customer Code", "COMPANY", "COUNTRY", "Visit Plan", "Visit Date", "Status"] : ["Customer Code", "COMPANY", "COUNTRY", "80-20"];

            tableHead.innerHTML = `<tr>${schema.map(k => `<th>${k}</th>`).join('')}<th>Actions</th></tr>`;
            tableBody.innerHTML = '';

            data.forEach(row => {
                let tr = `<tr>`;
                schema.forEach(k => {
                    let val = row[k];
                    if(k === 'Status') val = `<span class="status-badge badge-${val.toLowerCase()}">${val}</span>`;
                    tr += `<td>${val || ''}</td>`;
                });
                tr += `<td>
                    <span class="action-icon" onclick='editEntry("${row._id}")' style="cursor:pointer; margin-right:5px;">✏️</span>
                    <span class="action-icon" onclick="deleteEntry('${row._id}')" style="cursor:pointer; color:var(--danger);">🗑️</span>
                </td>`;
                tableBody.insertAdjacentHTML('beforeend', tr);
            });
        }

        // --- MODAL ---
        function openModal(row = null) {
            document.getElementById('entryModal').classList.add('open');
            if(currentTab === 'visits') {
                document.getElementById('visitForm').style.display = 'block';
                document.getElementById('customerForm').style.display = 'none';
                
                // Populate Dropdown based on available customers
                renderCustomerDropdown();

                if(row) {
                    // If editing, set select to current customer
                    document.getElementById('customer_select').value = row["Customer Code"] ? customers.find(c => c._id == row.createdBy)._id : "";
                    document.getElementById('v_editId').value = row._id;
                    document.getElementById('v_code').value = row["Customer Code"];
                    document.getElementById('v_company').value = row["COMPANY"];
                    document.getElementById('v_country').value = row["COUNTRY"];
                    document.getElementById('v_address').value = row["ADDRESS"] || "";
                    document.getElementById('v_place').value = row["PLACE"];
                    document.getElementById('v_plan').value = row["Visit Plan"];
                    document.getElementById('v_date').value = row["Visit Date"];
                    document.getElementById('v_status').value = row["Status"];
                    document.getElementById('v_val').value = row["Opportunities Values I Euro"];
                    document.getElementById('v_remarks').value = row["Remarks"];
                } else {
                    document.getElementById('visitForm').reset();
                    document.getElementById('v_editId').value = "";
                    document.getElementById('customer_select').value = "";
                }
            } else {
                document.getElementById('visitForm').style.display = 'none';
                document.getElementById('customerForm').style.display = 'block';
                if(row) {
                    document.getElementById('c_editId').value = row._id;
                    document.getElementById('c_code').value = row["Customer Code"];
                    document.getElementById('c_company').value = row["COMPANY"];
                    document.getElementById('c_country').value = row["COUNTRY"];
                    document.getElementById('c_address').value = row["ADDRESS"];
                    document.getElementById('c_8020').value = row["80-20"];
                    document.getElementById('c_resp').value = row["Service - Responsible"];
                } else {
                    document.getElementById('customerForm').reset();
                    document.getElementById('c_editId').value = "";
                }
            }
        }

        function closeModal() { document.getElementById('entryModal').classList.remove('open'); }

        async function saveData() {
            let payload = {};
            const endpoint = currentTab === 'visits' ? `${API_URL}/visits` : `${API_URL}/customers`;
            
            if(currentTab === 'visits') {
                // If select is used, we can rely on filled inputs, otherwise use inputs
                payload = {
                    _id: document.getElementById('v_editId').value,
                    createdBy: currentUser.id,
                    "Customer Code": document.getElementById('v_code').value,
                    "COMPANY": document.getElementById('v_company').value,
                    "COUNTRY": document.getElementById('v_country').value,
                    "PLACE": document.getElementById('v_place').value,
                    "ADDRESS": document.getElementById('v_address').value, // Use the address field filled from customer
                    "Visit Plan": document.getElementById('v_plan').value,
                    "Visit Date": document.getElementById('v_date').value,
                    "Status": document.getElementById('v_status').value,
                    "Opportunities Values I Euro": document.getElementById('v_val').value,
                    "Remarks": document.getElementById('v_remarks').value
                };
            } else {
                payload = {
                    _id: document.getElementById('c_editId').value,
                    createdBy: currentUser.id,
                    "Customer Code": document.getElementById('c_code').value,
                    "COMPANY": document.getElementById('c_company').value,
                    "COUNTRY": document.getElementById('c_country').value,
                    "ADDRESS": document.getElementById('c_address').value,
                    "80-20": document.getElementById('c_8020').value,
                    "Service - Responsible": document.getElementById('c_resp').value
                };
            }

            await fetch(endpoint, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            closeModal();
            loadData();
        }

        function editEntry(id) {
            const data = currentTab === 'visits' ? visits.find(v => v._id === id) : customers.find(c => c._id === id);
            openModal(data);
        }

        async function deleteEntry(id) {
            if(!confirm("Delete?")) return;
            const endpoint = currentTab === 'visits' ? `${API_URL}/visits/${id}` : `${API_URL}/customers/${id}`;
            await fetch(endpoint, { method: 'DELETE' });
            loadData();
        }

        function filterTable(q) {
            const rows = document.querySelectorAll('#dataTable tbody tr');
            q = q.toLowerCase();
            rows.forEach(r => { r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none'; });
        }

        // --- IMPORT/EXPORT ---
        async function handleImport(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const workbook = XLSX.read(e.target.result, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                await fetch(`${API_URL}/import`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ type: currentTab, data: json, userId: currentUser.id })
                });
                alert(`Imported ${json.length} records`);
                loadData();
            };
            reader.readAsArrayBuffer(file);
            input.value = '';
        }

        function exportData() {
            const data = currentTab === 'visits' ? visits : customers;
            if(!data.length) return alert("No data");
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, `export_${currentTab}.xlsx`);
        }
    </script>
</body>
</html>
