<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner - Auto-Fill Edition</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #2563eb; --primary-light: #eff6ff; --primary-dark: #1e40af;
            --secondary: #64748b; --bg-body: #f8fafc; --bg-card: #ffffff;
            --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0;
            --success: #10b981; --danger: #ef4444;
            --radius: 12px; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Layout */
        aside { width: 260px; background: var(--bg-card); border-right:1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem; z-index: 10; }
        .brand { font-size: 1.25rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2.5rem; }
        nav button { background: none; border: none; width: 100%; padding: 0.75rem 1rem; text-align: left; cursor: pointer; color: var(--text-muted); border-radius: var(--radius); display: flex; align-items: center; gap: 0.75rem; font-weight: 500; transition: 0.2s; margin-bottom: 0.5rem; }
        nav button:hover { background-color: var(--primary-light); color: var(--primary); }
        nav button.active { background-color: var(--primary); color: white; box-shadow: var(--shadow); }

        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .header-title h2 { font-size: 1.2rem; font-weight: 700; }
        .header-actions { display: flex; gap: 0.75rem; }
        
        .btn { padding: 0.55rem 1rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline:hover { background: #f8fafc; }
        .btn-icon { padding: 0.5rem; border: none; background: transparent; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; border-radius: 6px; }
        .btn-icon:hover { color: var(--primary); background: var(--primary-light); }

        .content-scroll { flex: 1; overflow-y: auto; padding: 2rem; }

        /* Table */
        .table-container { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
        .table-controls { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .search-box { position: relative; width: 300px; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input { width: 100%; padding: 0.6rem 0.6rem 0.6rem 2.5rem; border: 1px solid var(--border); border-radius: 8px; outline: none; transition: 0.2s; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 1rem; background: #f8fafc; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 1rem; border-bottom:1px solid var(--border); vertical-align: middle; }
        tr:hover { background-color: #f8fafc; }

        .status-badge { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .badge-planned { background: #eff6ff; color: var(--primary); }
        .badge-completed { background: #ecfdf5; color: var(--success); }

        .action-group { display: flex; gap: 0.5rem; }
        .action-icon { cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 4px; }
        .action-icon:hover { color: var(--primary); background: #e2e8f0; }
        .action-icon.delete:hover { color: var(--danger); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 50; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--bg-card); width: 95%; max-width: 900px; max-height: 90vh; border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); }
        .modal-body { padding: 1.5rem; overflow-y: auto; }
        .modal-footer { padding: 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 1rem; background: #f8fafc; }

        .form-section { margin-bottom: 2rem; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; position: relative; }
        .form-section-title { position: absolute; top: -12px; left: 15px; background: var(--bg-card); padding: 0 10px; font-weight: 700; color: var(--primary); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; margin-top: 0.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
        .form-group input, .form-group select, .form-group textarea { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; outline: none; font-size: 0.9rem; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        
        .autofill-indicator { font-size: 0.75rem; color: var(--success); display: none; align-items: center; gap: 4px; margin-bottom: 0.5rem; }

        #visitForm { display: block; } #customerForm { display: none; }

        /* Toast */
        .toast-container { position: fixed; bottom: 25px; right: 25px; z-index: 100; display: flex; flex-direction: column; gap: 12px; }
        .toast { background: var(--text-main); color: white; padding: 1rem 1.5rem; border-radius: var(--radius); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; min-width: 300px; font-size: 0.9rem; }
        .toast.success { border-left: 5px solid var(--success); }
        .toast.error { border-left: 5px solid var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <aside>
        <div class="brand"><i class="ph ph-airplane-tilt"></i> Travel Planner</div>
        <nav>
            <button class="active" onclick="switchTab('visits')"><i class="ph ph-calendar-check"></i> Visit Planner</button>
            <button onclick="switchTab('customers')"><i class="ph ph-users-three"></i> Customer Master</button>
        </nav>
    </aside>

    <main>
        <header>
            <div class="header-title"><h2 id="pageTitle">Visit Planner</h2></div>
            <div class="header-actions">
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleImport(this)">
                <button class="btn" onclick="document.getElementById('fileInput').click()"><i class="ph ph-upload-simple"></i> Import Excel</button>
                <button class="btn" onclick="exportData()"><i class="ph ph-download-simple"></i> Export</button>
                <button class="btn btn-primary" onclick="openModal()"><i class="ph ph-plus"></i> Add New</button>
            </div>
        </header>

        <div class="content-scroll">
            <div class="table-container">
                <div class="table-controls">
                    <div class="search-box"><i class="ph ph-magnifying-glass"></i><input type="text" placeholder="Search..." onkeyup="filterTable(this.value)"></div>
                </div>
                <div style="overflow-x: auto;">
                    <table id="dataTable"><thead></thead><tbody></tbody></table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="entryModal">
        <div class="modal">
            <div style="padding:1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">
                <h3 id="modalTitle">Add Entry</h3>
                <button class="btn-icon" onclick="closeModal()"><i class="ph ph-x"></i></button>
            </div>
            <div class="modal-body">
                
                <!-- VISIT FORM -->
                <form id="visitForm">
                    <input type="hidden" id="editId">
                    
                    <!-- Auto-fill Indicator -->
                    <div id="autofillMsg" class="autofill-indicator"><i class="ph ph-check-circle"></i> Details fetched from Customer Database</div>

                    <div class="form-section">
                        <span class="form-section-title">Customer Selection</span>
                        <div class="form-grid">
                            <div class="form-group" style="grid-column: span 2;">
                                <label>Customer Code <small>(Auto-fills details)</small></label>
                                <!-- Datalist for Native Autocomplete -->
                                <input type="text" id="v_code" list="customerList" autocomplete="off" placeholder="Type Code..." required>
                                <datalist id="customerList">
                                    <!-- Options populated by JS -->
                                </datalist>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <span class="form-section-title">Visit Details</span>
                        <div class="form-grid">
                            <div class="form-group"><label>COMPANY</label><input type="text" id="v_company" required></div>
                            <div class="form-group"><label>COUNTRY</label><input type="text" id="v_country"></div>
                            <div class="form-group"><label>PLACE</label><input type="text" id="v_place"></div>
                            <div class="form-group"><label>Visit Plan</label><input type="text" id="v_plan"></div>
                            <div class="form-group"><label>Visit Date</label><input type="date" id="v_date"></div>
                            <div class="form-group"><label>Status</label><select id="v_status"><option>Planned</option><option>Completed</option><option>Pending</option></select></div>
                            <div class="form-group"><label>Opp. Value (€)</label><input type="number" id="v_val"></div>
                        </div>
                    </div>
                </form>

                <!-- CUSTOMER FORM -->
                <form id="customerForm">
                    <input type="hidden" id="c_editId">
                    <div class="form-section">
                        <span class="form-section-title">General Info</span>
                        <div class="form-grid">
                            <div class="form-group"><label>Customer Code</label><input type="text" id="c_code" required></div>
                            <div class="form-group"><label>COMPANY</label><input type="text" id="c_company" required></div>
                            <div class="form-group"><label>COUNTRY</label><input type="text" id="c_country"></div>
                            <div class="form-group"><label>ADDRESS</label><input type="text" id="c_address"></div>
                        </div>
                    </div>
                    <div class="form-section">
                        <span class="form-section-title">Service & Audit</span>
                        <div class="form-grid">
                            <div class="form-group"><label>80-20</label><select id="c_8020"><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></div>
                            <div class="form-group"><label>Service - Responsible</label><input type="text" id="c_resp"></div>
                        </div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveData()">Save</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const API_URL = window.location.origin + '/api';
        let currentTab = 'visits';
        let visits = [], customers = [];

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', async () => {
            await loadData();
            setupAutoFill();
        });

        // --- API FUNCTIONS ---
        async function loadData() {
            const endpoint = currentTab === 'visits' ? `${API_URL}/visits` : `${API_URL}/customers`;
            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                if(currentTab === 'visits') visits = data; else customers = data;
                renderTable();
                populateDatalist(); // Update autocomplete list
            } catch (err) { console.error(err); showToast("Failed to load data", 'error'); }
        }

        async function saveToDB(item) {
            const endpoint = currentTab === 'visits' ? `${API_URL}/visits` : `${API_URL}/customers`;
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            });
            const json = await res.json();
            if(!json.success) throw new Error(json.error);
            
            showToast("Saved Successfully", "success");
            loadData();
        }

        async function deleteFromDB(id) {
            if(!confirm("Delete?")) return;
            const endpoint = currentTab === 'visits' ? `${API_URL}/visits/${id}` : `${API_URL}/customers/${id}`;
            await fetch(endpoint, { method: 'DELETE' });
            showToast("Deleted", "success");
            loadData();
        }

        async function importToDB(data) {
            const res = await fetch(`${API_URL}/import`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: currentTab, data: data })
            });
            const json = await res.json();
            if(json.success) {
                showToast(`Imported ${json.count} records`, "success");
                // CRITICAL FIX: Reload data to show new items
                await loadData(); 
            } else {
                showToast(json.error, "error");
            }
        }

        // --- AUTO-FILL LOGIC ---
        function setupAutoFill() {
            const codeInput = document.getElementById('v_code');
            const autofillMsg = document.getElementById('autofillMsg');
            
            codeInput.addEventListener('input', (e) => {
                const code = e.target.value.trim();
                if(!code) {
                    autofillMsg.style.display = 'none';
                    return;
                }

                // Find customer in local array (fast)
                const customer = customers.find(c => c["Customer Code"] === code);
                
                if (customer) {
                    autofillMsg.style.display = 'flex';
                    document.getElementById('v_company').value = customer["COMPANY"];
                    document.getElementById('v_country').value = customer["COUNTRY"];
                    document.getElementById('v_place').value = customer["ADDRESS"]; // Mapping Address to Place
                } else {
                    autofillMsg.style.display = 'none';
                }
            });
        }

        function populateDatalist() {
            const list = document.getElementById('customerList');
            list.innerHTML = '';
            customers.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c["Customer Code"];
                opt.label = `${c["Customer Code"]} - ${c["COMPANY"]}`;
                list.appendChild(opt);
            });
        }

        // --- UI LOGIC ---
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            if(tab==='visits') document.querySelectorAll('nav button')[0].classList.add('active');
            else document.querySelectorAll('nav button')[1].classList.add('active');
            
            document.getElementById('pageTitle').innerText = tab === 'visits' ? "Visit Planner" : "Customer Master";
            loadData();
        }

        function renderTable() {
            const tableHead = document.querySelector('#dataTable thead');
            const tableBody = document.querySelector('#dataTable tbody');
            const data = currentTab === 'visits' ? visits : customers;
            
            const headers = data.length > 0 ? Object.keys(data[0]) : [];
            tableHead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}<th>Actions</th></tr>`;
            tableBody.innerHTML = '';

            data.forEach(row => {
                let tr = `<tr>`;
                headers.forEach(h => {
                    let val = row[h];
                    if(h === 'Status') val = `<span class="status-badge badge-${val.toLowerCase()}">${val}</span>`;
                    tr += `<td>${val || ''}</td>`;
                });
                tr += `<td>
                    <span class="action-icon" onclick='editEntry("${row._id}")'><i class="ph ph-pencil-simple"></i></span>
                    <span class="action-icon delete" onclick="deleteFromDB('${row._id}')"><i class="ph ph-trash"></i></span>
                </td></tr>`;
                tableBody.insertAdjacentHTML('beforeend', tr);
            });
        }

        function openModal(row = null) {
            document.getElementById('entryModal').classList.add('open');
            if(currentTab === 'visits') {
                document.getElementById('visitForm').style.display = 'block';
                document.getElementById('customerForm').style.display = 'none';
                if(row) {
                    document.getElementById('editId').value = row._id;
                    document.getElementById('v_code').value = row["Customer Code"];
                    document.getElementById('v_company').value = row["COMPANY"];
                    document.getElementById('v_country').value = row["COUNTRY"];
                    document.getElementById('v_place').value = row["PLACE"];
                    document.getElementById('v_plan').value = row["Visit Plan"];
                    document.getElementById('v_date').value = row["Visit Date"];
                    document.getElementById('v_status').value = row["Status"];
                    document.getElementById('v_val').value = row["Opportunities Values I Euro"];
                    document.getElementById('autofillMsg').style.display = 'none'; // Hide indicator on edit
                } else {
                    document.getElementById('visitForm').reset();
                    document.getElementById('editId').value = "";
                }
            } else {
                document.getElementById('visitForm').style.display = 'none';
                document.getElementById('customerForm').style.display = 'block';
                if(row) {
                    document.getElementById('c_editId').value = row._id;
                    document.getElementById('c_code').value = row["Customer Code"];
                    document.getElementById('c_company').value = row["COMPANY"];
                    document.getElementById('c_country').value = row["COUNTRY"];
                    document.getElementById('c_address').value = row["ADDRESS"];
                    document.getElementById('c_8020').value = row["80-20"];
                    document.getElementById('c_resp').value = row["Service - Responsible"];
                } else {
                    document.getElementById('customerForm').reset();
                    document.getElementById('c_editId').value = "";
                }
            }
        }

        function closeModal() { document.getElementById('entryModal').classList.remove('open'); }
        function editEntry(id) { openModal(visits.find(v=>v._id===id) || customers.find(c=>c._id===id)); }

        function saveData() {
            let item = {};
            if(currentTab === 'visits') {
                item = {
                    _id: document.getElementById('editId').value || undefined,
                    "Customer Code": document.getElementById('v_code').value,
                    "COMPANY": document.getElementById('v_company').value,
                    "COUNTRY": document.getElementById('v_country').value,
                    "PLACE": document.getElementById('v_place').value,
                    "Visit Plan": document.getElementById('v_plan').value,
                    "Visit Date": document.getElementById('v_date').value,
                    "Status": document.getElementById('v_status').value,
                    "Opportunities Values I Euro": document.getElementById('v_val').value
                };
            } else {
                item = {
                    _id: document.getElementById('c_editId').value || undefined,
                    "Customer Code": document.getElementById('c_code').value,
                    "COMPANY": document.getElementById('c_company').value,
                    "COUNTRY": document.getElementById('c_country').value,
                    "ADDRESS": document.getElementById('c_address').value,
                    "80-20": document.getElementById('c_8020').value,
                    "Service - Responsible": document.getElementById('c_resp').value
                };
            }
            saveToDB(item);
            closeModal();
        }

        function filterTable(q) {
            const rows = document.querySelectorAll('#dataTable tbody tr');
            q = q.toLowerCase();
            rows.forEach(r => { r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none'; });
        }

        // --- IMPORT/EXPORT ---
        async function handleImport(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    let data = [];
                    if (file.name.endsWith('.csv')) {
                        const workbook = XLSX.read(e.target.result, { type: 'string' });
                        data = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    } else {
                        const workbook = XLSX.read(e.target.result, { type: 'array' });
                        data = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    }

                    if (data.length > 0) {
                        await importToDB(data);
                    } else {
                        showToast("File is empty", "error");
                    }
                } catch (err) {
                    showToast("Error reading file: " + err.message, "error");
                }
            };
            
            if (file.name.endsWith('.csv')) {
                reader.readAsText(file);
            } else {
                reader.readAsArrayBuffer(file);
            }
            input.value = '';
        }

        function exportData() {
            const data = currentTab === 'visits' ? visits : customers;
            if(!data.length) return showToast("No data to export", "error");
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, `export_${currentTab}.xlsx`);
        }

        function showToast(msg, type) {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.innerHTML = `<i class="ph ${type==='success'?'ph-check-circle':'ph-warning-circle'}"></i> <span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(), 300); }, 3000);
        }
    </script>
</body>
</html>
